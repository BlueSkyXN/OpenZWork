name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: windows-latest
            platform: windows-amd64
          - os: ubuntu-latest
            platform: linux-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      # 与 mise.toml 固定版本一致（Node 24.14.0 / pnpm 10.33.2）。
      # --ignore-scripts：检查型 CI 不需要 Electron 下载与原生编译（见 WP-02 错误基线）。
      - name: Install dependencies (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Workspace TypeScript version (must be 6.x, not global)
        run: pnpm exec tsc --version

      - name: Workflow configuration regression tests
        run: node --test tests/ci/*.test.mjs

      # 以下三项为 WP-02 双树错误基线中全绿的门禁（两树均 rc=0）。
      - name: Root typecheck (11 projects)
        run: pnpm typecheck

      - name: Root lint
        run: pnpm lint

      - name: Architecture boundaries
        run: pnpm architecture:check

      # 内层 Agent workspace：turbo 未随根安装进入内层 .bin（嵌套 workspace 结构性限制，
      # WP-02 已记录），故用固定版本 npx turbo；本地基线 2.9.14 下 25/25 通过。
      # --cache-dir=.turbo + actions/cache：turbo 默认缓存在 node_modules/.cache 不随
      # pnpm store 保留，按 commit 保存、前缀恢复后由 turbo 按 task hash 自行校验，
      # 未触及内层包的 PR（多数外层改动）可整段跳过重编译。
      - name: Cache turbo task outputs
        uses: actions/cache@v6.1.0
        with:
          path: apps/zcode-cli/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Agent workspace typecheck (turbo)
        working-directory: apps/zcode-cli
        run: npx --yes turbo@2.9.14 run typecheck --cache-dir=.turbo

      # stage1 私有化清理的结构断言（当前 33 个顶层用例；WP-03/08/09 扫描为 git 全仓口径）。
      - name: Stage1 cleanup structural tests
        run: node --test tests/private-cleanup/cleanup.test.cjs
        env:
          TYPESCRIPT_MODULE_PATH: ${{ github.workspace }}/node_modules/typescript

      # WP-03 路径行为测试依赖内层 contracts/core 构建产物；Windows 跑跨平台的全局工作流用例，
      # POSIX shell 启动/Agent wrapper 用例在 macOS 与 Linux 上执行（测试内 skip 仅判 win32），
      # 真实远端与安装包 UAT 另记。
      - name: Identity and remote path behavior tests
        run: pnpm exec tsx --test tests/private-cleanup/identity-paths.test.ts

      # WP-03 远端链路与发行安装的本地 UAT：真实 esbuild bundle + 真实启动命令/zcode-hello
      # 握手 + 真实 installFile 上传链 + 真实 install.sh；传输层以本地 /bin/sh 后端替换
      # SSH/WSL/Docker（测试文件头注记录了官方 App 终端的环境渗入坑与净化策略）。
      # Windows 上三个用例自跳过（POSIX shell）；bundle 缺失时自跳过而非静默通过。
      - name: Build remote server bundle (UAT)
        run: pnpm --filter @zcode/server build:remote

      - name: Remote chain and installer local UAT
        run: pnpm exec tsx --test tests/private-cleanup/remote-chain-local.test.ts

      # 包级测试：services（含 E1 记忆迁移/统计门禁/技能开关）与 ui（需显式 tsconfig 解析 @ 别名）。
      - name: Package tests (services + ui)
        run: pnpm test

      # 已知上游既有红灯（不设卡点、不静默：内层 oxlint 84 项 max-lines 类错误、
      # desktop 全工程 tsc 211/204 对称错误）按计划在后续工作包处置，暂不入 CI。
