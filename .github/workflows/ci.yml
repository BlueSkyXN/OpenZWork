name: CI
run-name: ${{ github.ref_type == 'tag' && format('Release {0} / {1}', github.ref_name, github.workflow) || '' }}

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-openzwork", "v*openzwork.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: core ${{ matrix.lane }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, windows-amd64, linux-amd64]
        lane: [regressions, unit]
        include:
          # macos-14 退役演练会在步骤执行前取消作业；macos-15 延续 arm64 runner。
          - os: macos-15
            platform: macos-arm64
          - os: windows-latest
            platform: windows-amd64
          - os: ubuntu-latest
            platform: linux-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      # 与 mise.toml 固定版本一致（Node 24.14.0 / pnpm 11.28.6）。
      # --ignore-scripts：检查型 CI 不需要 Electron 下载与原生编译（见 WP-02 错误基线）。
      - name: Install dependencies (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Workspace TypeScript version (must be 6.x, not global)
        if: matrix.lane == 'regressions'
        run: pnpm exec tsc --version

      - name: Workflow configuration regression tests
        if: matrix.lane == 'regressions'
        run: node --test tests/ci/*.test.mjs

      # 以下三项为 WP-02 双树错误基线中全绿的门禁（两树均 rc=0）。
      # NODE_OPTIONS：v3.15.1 同步后 tsc -b 全量构建在 macOS arm64（7GB runner）上
      # 触发 V8 "Ineffective mark-compacts near heap limit" OOM（run 39174059794），
      # 显式抬高老生代上限；不改代码、不拆项目，只修运行时内存配置。
      - name: Application typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Root lint
        if: matrix.lane == 'regressions'
        run: pnpm lint

      - name: OpenZWork file formatting
        if: matrix.lane == 'regressions'
        run: pnpm fmt:check

      - name: Architecture boundaries
        if: matrix.lane == 'regressions'
        run: pnpm architecture:check
        env:
          # 新 tag 的 before 为零 SHA，交给检查器按默认分支发现基线。
          ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || (github.ref_type == 'branch' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}

      - name: Repository script regressions
        if: matrix.lane == 'regressions'
        run: pnpm test:repo-scripts

      # 内层 Agent workspace：turbo 未随根安装进入内层 .bin（嵌套 workspace 结构性限制，
      # WP-02 已记录），故用固定版本 npx turbo；本地基线 2.9.14 下 25/25 通过。
      # --cache-dir=.turbo + actions/cache：turbo 默认缓存在 node_modules/.cache 不随
      # pnpm store 保留，按 commit 保存、前缀恢复后由 turbo 按 task hash 自行校验，
      # 未触及内层包的 PR（多数外层改动）可整段跳过重编译。
      - name: Cache turbo task outputs
        uses: actions/cache@v6.1.0
        with:
          path: apps/zcode-cli/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Agent workspace typecheck (turbo)
        working-directory: apps/zcode-cli
        # pnpm 11 的 verify-deps-before-run 会在 run 前触发内层 install；嵌套 workspace
        # 解析不到根的 @zcode/shared（与 build-desktop-agent-cli.mjs 同款关闭）。
        env:
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: npx --yes turbo@2.9.14 run typecheck --cache-dir=.turbo

      # 项目 MCP 集成测试依赖内置 node_repl 的真实 seed 入口；复用桌面 Agent 的统一构建链。
      - name: Build CLI and required MCP runtimes
        run: node scripts/build-desktop-agent-cli.mjs

      - name: Model capability request mapping regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/adapters exec vitest run tests/model-capability-wire.test.ts --pool=threads --no-file-parallelism --maxWorkers=1

      - name: Conversation usage accuracy regression
        if: matrix.lane == 'regressions'
        run: |
          pnpm --filter @zcode/adapters exec vitest run tests/runner-stream-timing-wire.test.ts --pool=threads --no-file-parallelism --maxWorkers=1
          pnpm --filter @zcode/bootstrap exec vitest run tests/native-conversation-metrics.test.ts --pool=threads --no-file-parallelism --maxWorkers=1
          pnpm --filter @zcode/core exec vitest run tests/session-history-rewind.test.ts --pool=threads --no-file-parallelism --maxWorkers=1

      - name: Workflow child interaction regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/bootstrap exec vitest run tests/script-workflow-child-runtime.test.ts --bail=1

      - name: Project configuration and storage relocation regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/adapters exec vitest run tests/project-config-compatibility.test.ts tests/storage-relocation.test.ts --bail=1

      # OW-P024：Main 固定 DB 的 Env 优先级是工作流查询共享载体的前提（真实临时用户/项目配置）。
      - name: Workflow query session db priority regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/adapters exec vitest run tests/workflow-query-session-db.test.ts --bail=1

      - name: System prompt context regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/core exec vitest run tests/system-prompt-settings.test.ts tests/context-builder.test.ts --bail=1

      - name: CLI protocol regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/bootstrap exec vitest run tests/zcode-protocol.test.ts --bail=1

      - name: Legacy memory isolation regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/bootstrap exec vitest run tests/memory-isolation.test.ts --bail=1

      - name: Bash output settlement and shutdown regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/adapters exec vitest run tests/bash-direct-execution.test.ts tests/bash-shutdown.test.ts --bail=1

      - name: Workflow scheduling and auxiliary session regression
        if: matrix.lane == 'regressions'
        # 真实 SQLite 冷恢复在多文件同时转换和启动运行时时重复触发默认 5 秒期限。
        # 保留用例与期限，限制这个集成步骤的文件并发；平台和 Extended runner 仍并行。
        run: pnpm --filter @zcode/bootstrap exec vitest run tests/provider-registry-app-runtime.test.ts tests/v4-cold-resume.test.ts tests/workflow-concurrency-governor.test.ts tests/workflow-effective-selection.test.ts tests/workflow-fault-matrix.stop.test.ts tests/zcode-protocol-transport.test.ts --no-file-parallelism --maxWorkers=1 --bail=1

      - name: Local bundled plugins and metadata regression
        if: matrix.lane == 'regressions'
        # Windows 两次在不同冷缓存用例超过默认 5 秒；真实目录播种/清理沿用 30 秒集成预算。
        # 只调整本步骤的测试期限，保留单 worker、全部断言及首次失败即停止。
        run: pnpm --filter @zcode/bootstrap exec vitest run tests/plugins.test.ts tests/plugins-protocol.test.ts --no-file-parallelism --maxWorkers=1 --testTimeout=30000 --bail=1

      - name: ToolSearch runtime regression
        if: matrix.lane == 'regressions'
        # hydration 会真实写入并重开 SQLite；五文件并行触发 5 秒期限，沿用集成隔离。
        run: pnpm --filter @zcode/core exec vitest run tests/tool-search-execution.test.ts tests/tool-search-hydration.test.ts tests/tool-search-result-budget.test.ts tests/tool-search-subagent.test.ts tests/tool-search-request-preparation.test.ts --no-file-parallelism --maxWorkers=1 --bail=1

      - name: ToolSearch MCP and connection lifecycle regression
        if: matrix.lane == 'regressions'
        # OpenZWork：linux runner 上 forks worker 在本套件收尾期挂起（两轮同点：SIGINT 后
        # 终止超时→exit 130），本地 mac 同命令全绿且套件内传输层全部 mock、无真实子进程——
        # 固定 threads 池绕开 forks 终止路径，并串行防并行编排差异。
        run: |
          pnpm --filter @zcode/adapters exec vitest run tests/tool-search-capability.test.ts tests/tool-search-mcp.test.ts tests/tool-search-wire.test.ts tests/plugin-mcp-always-load.test.ts tests/plugin-mcp-tool-search-wire.test.ts tests/mcp-connection-pool.test.ts --pool=threads --no-file-parallelism --maxWorkers=1
          echo "[openzwork] adapters step: unit files done, running mcp.test.ts alone"
          pnpm --filter @zcode/adapters exec vitest run tests/mcp.test.ts --pool=threads --no-file-parallelism --maxWorkers=1

      - name: MCP Apps readiness and workflow shell inheritance regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/bootstrap exec vitest run tests/mcp-ui-connection-ready.test.ts tests/script-workflow.test.ts --bail=1

      - name: Standard MCP transport regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/adapters exec vitest run tests/mcp-stdio-transport.test.ts tests/mcp-oauth-lease.test.ts

      - name: Standard MCP project configuration regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/bootstrap exec vitest run tests/mcp-project-config.test.ts --bail=1

      - name: Node REPL MCP regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/node-repl-host exec vitest run test/mcp-server.test.ts --bail=1

      - name: CLI workflow option regression
        if: matrix.lane == 'regressions'
        run: pnpm --filter @zcode/cli exec node --import tsx --test tests/workflow-mode-option.test.ts tests/headless-workflow-option.test.ts

      - name: CLI artifact workflow option
        if: matrix.lane == 'regressions'
        run: node --test tests/private-cleanup/cli-artifact-workflow.test.mjs

      - name: Host UI composition regression
        if: matrix.lane == 'regressions'
        run: pnpm exec vitest run packages/services/test/localServicesPluginUiComposition.test.ts --bail=1

      - name: Remote control regression
        if: matrix.lane == 'regressions'
        run: pnpm exec vitest run packages/desktop/test/webRemoteControlSharedHostAttachments.test.ts --bail=1

      # stage1 私有化清理的结构与协议断言（WP-03/08/09 扫描为 git 全仓口径）。
      - name: Stage1 cleanup structural tests
        if: matrix.lane == 'regressions'
        run: node --test tests/private-cleanup/cleanup.test.cjs
        env:
          TYPESCRIPT_MODULE_PATH: ${{ github.workspace }}/node_modules/typescript

      # Windows 执行跨平台的全局工作流用例；POSIX shell 用例在 macOS/Linux 执行。
      - name: Identity and remote path behavior tests
        if: matrix.lane == 'regressions'
        run: pnpm exec tsx --test tests/private-cleanup/identity-paths.test.ts

      # 自动化 bundle/握手/安装脚本冒烟；传输使用本地 shell，覆盖范围由测试结果记录。
      - name: Build remote server bundle
        run: pnpm --filter @zcode/server build:remote

      - name: Remote chain smoke tests
        if: matrix.lane == 'regressions'
        run: pnpm exec tsx --test tests/private-cleanup/remote-chain-local.test.ts

      - name: Core unit regression
        if: matrix.lane == 'unit'
        id: core_tests
        run: pnpm test:ci:core --reporter=default --reporter=json --outputFile=.run-logs/core-tests.json

      - name: Upload core test results
        if: always() && matrix.lane == 'unit' && steps.core_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: core-tests-${{ matrix.platform }}
          path: .run-logs/core-tests.json
          archive: true
          if-no-files-found: error

  # OW-P024：桌面工作流中枢 E2E。历史上面向 Docker 认证流程（本机手动），CI 从未执行
  # 过任何 wdio 用例；本 job 让 hub 场景（项目恢复、双刷新收敛、错误态标记）在每个
  # PR 上有真实浏览器证据。仅 macos（Electron/chromedriver 免额外服务；Linux 需 xvfb、
  # Windows sharding 另行评估），单 spec 控制成本（~4 分钟）。
  desktop-e2e:
    name: desktop e2e (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      # wdio 需要完整安装：Electron 二进制与 chromedriver 由 postinstall 落盘
      # （checks lane 的 --ignore-scripts 形态没有它们）。
      - name: Install dependencies (frozen lockfile, with scripts)
        run: pnpm install --frozen-lockfile

      # 复用桌面 Agent 的统一构建链（hub 用例经真实内置 CLI 读取工作流）。
      - name: Build CLI and required MCP runtimes
        run: node scripts/build-desktop-agent-cli.mjs

      # wdio 的报告器在启动时导入 @zcode/e2e-report 的 dist-node（本机由
      # typecheck:e2e/pretest 钩子顺带构建；CI 显式构建，产物缺省会 ERR_MODULE_NOT_FOUND）。
      - name: Build e2e report runtime
        run: pnpm --filter @zcode/e2e-report build:node

      - name: Run workflows hub E2E
        id: hub_e2e
        env:
          ZCODE_E2E_RENDERER_BRIDGE_PREFLIGHT_TIMEOUT_MS: "60000"
        run: >
          pnpm --filter @zcode/desktop exec wdio run wdio.conf.ts
          --spec ./test/e2e/automations-workflows-hub.test.ts
          --mochaOpts.grep '已保存工作流中枢 E2E'

      - name: Upload E2E artifacts
        if: always() && steps.hub_e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-e2e-hub-artifacts
          path: packages/desktop/.e2e-artifacts
          archive: true
          if-no-files-found: ignore

  check-results:
    name: checks (${{ matrix.platform }})
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, windows-amd64, linux-amd64]
    steps:
      # needs.checks.result 覆盖整个矩阵；任一路径跳过、取消或失败都不能放行。
      - name: Require every core lane to succeed
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
