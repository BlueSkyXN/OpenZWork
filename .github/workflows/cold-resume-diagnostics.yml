name: Cold resume diagnostics
on:
  workflow_dispatch: null
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Application typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Cache turbo task outputs
        uses: actions/cache@v6.1.0
        with:
          path: apps/zcode-cli/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Agent workspace typecheck (turbo)
        working-directory: apps/zcode-cli
        env:
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: npx --yes turbo@2.9.14 run typecheck --cache-dir=.turbo
      - name: Build CLI and required MCP runtimes
        run: node scripts/build-desktop-agent-cli.mjs
      - name: Repeat focused cold resume regressions
        shell: pwsh
        run: >-
          for ($coldIteration = 1; $coldIteration -le 20; $coldIteration++) {
            Write-Output "Cold resume iteration $coldIteration"
            pnpm --filter @zcode/bootstrap exec vitest run tests/v4-cold-resume.test.ts -t 'cold rename/delete|缺档位旧选择' --no-file-parallelism --maxWorkers=1 --bail=1 --reporter=default --reporter=json --outputFile=.run-logs/cold/$coldIteration.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cold-resume-diagnostics
          path: apps/zcode-cli/packages/bootstrap/.run-logs/cold/
          archive: true
          if-no-files-found: error
