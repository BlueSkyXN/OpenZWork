name: Installers
run-name: ${{ github.ref_type == 'tag' && format('Release {0} / {1}', github.ref_name, github.workflow) || '' }}

# 分支默认产出 Preview；正式 tag 或手动固定来源产出 production 未签名安装包。
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Immutable source commit for dispatch builds (empty uses the event commit; never a floating branch head)
        type: string
        default: ""
      build_production:
        description: Build unsigned production installers from source_commit without publishing (no tag, no release)
        type: boolean
        default: false
      release_tag:
        description: Existing formal OpenZWork tag for a production installer
        type: string
        default: ""
      release_commit:
        description: Expected full source commit SHA of the release tag
        type: string
        default: ""
      publish_installer_run:
        description: Publish existing production artifacts from this successful run (empty builds installers)
        type: string
        default: ""
      core_run:
        description: Successful CI run for the exact release commit
        type: string
        default: ""
      extended_run:
        description: Successful complete Extended run for the exact release commit
        type: string
        default: ""
      release_notes:
        description: Markdown release notes for publishing the reviewed draft
        type: string
        default: ""
      zcode_dist_base_url:
        description: Download base URL embedded in the independent Node dist install script (build:zcode)
        type: string
        default: "https://example.invalid/zcode/deps/zcode/"
  push:
    branches: [main, "wp**"]
    tags: ["v*-openzwork", "v*openzwork.*"]

permissions:
  contents: read

concurrency:
  group: installers-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}-${{ inputs.publish_installer_run && 'publish' || 'build' }}
  cancel-in-progress: ${{ !inputs.publish_installer_run }}

jobs:
  installer:
    if: ${{ !inputs.publish_installer_run }}
    name: installer (${{ matrix.platform }})
    env:
      # 三条路由：正式 tag / 正式 tag 直跑 = production；dispatch 的 build_production
      # = production 但只构建不发布；其余分支 push 与普通 dispatch = Preview。
      ZCODE_ENV: ${{ (inputs.release_tag || github.ref_type == 'tag' || inputs.build_production == true) && 'production' || '' }}
      ZCODE_PREVIEW_IDENTITY: "0"
      ZCODE_ENABLE_MAC_SIGN: "0"
      ZCODE_ENABLE_WINDOWS_SIGN: "0"
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      RELEASE_COMMIT: ${{ inputs.release_commit || (github.ref_type == 'tag' && github.sha) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 退役演练会在步骤执行前取消作业；macos-15 延续 arm64 runner。
          - os: macos-15
            platform: macos-arm64
            bundle-os: mac
            bundle-arch: arm64
            electron-cache: ~/Library/Caches/electron
            builder-cache: ~/Library/Caches/electron-builder
          - os: windows-latest
            platform: windows-amd64
            bundle-os: win
            bundle-arch: x64
            electron-cache: ~/AppData/Local/electron/Cache
            builder-cache: ~/AppData/Local/electron-builder/Cache
          - os: ubuntu-latest
            platform: linux-amd64
            bundle-os: linux
            bundle-arch: x64
            electron-cache: ~/.cache/electron
            builder-cache: ~/.cache/electron-builder
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # OZ-F011：按 SHA 浅检出会缺少正式 tag 引用，导致后续源码校验失败。
      # 正式构建取完整标签 ref，并在下一步与期望的提交核对。
      - uses: actions/checkout@v7.0.1
        with:
          ref: >-
            ${{ (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) ||
            inputs.source_commit || (github.ref_type == 'tag' && github.ref) || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      # dispatch 钉定来源的完整性：checkout 必须逐字等于请求的完整 SHA。
      - &verify-dispatch-source
        name: Verify dispatch source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          const expected = process.env.SOURCE_COMMIT || '';
          if (!expected) process.exit(0);
          if (!/^[0-9a-f]{40}$/.test(expected)) {
            throw new Error('source_commit must be a full 40-hex commit SHA');
          }
          const head = (await exec('git', ['rev-parse', 'HEAD'])).stdout.trim();
          if (head !== expected) {
            throw new Error(`dispatch checkout ${head} does not match requested source ${expected}`);
          }
          console.log(JSON.stringify({ sourceCommit: head }));
          NODE

      # production 仅构建入口（CI-FIRST §2.8）：用固定 source_commit 产出未签名 production
      # 安装包，不依赖正式 tag，也不进入 publish job。缺 source_commit 直接失败——不能用
      # 浮动分支头充当验收来源。
      - name: Require immutable source for production build-only
        if: inputs.build_production == true
        shell: bash
        run: |
          if [ -z "$SOURCE_COMMIT" ]; then
            echo "::error::build_production requires source_commit (full 40-hex SHA)"; exit 1
          fi
          if ! printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_commit must be a full 40-hex commit SHA"; exit 1
          fi
          echo "production build-only from $SOURCE_COMMIT (unsigned, not published)"

      # Workflow 可以来自更新的主干，源码必须固定到已有 tag；不能把 run.head_sha 当源码 SHA。
      - &verify-release-source
        name: Verify release source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFile } from 'node:child_process';
          import { readFile } from 'node:fs/promises';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          const tag = process.env.RELEASE_TAG || '';
          const expected = process.env.RELEASE_COMMIT || '';
          if (!tag && !expected) process.exit(0);
          if (!/^[0-9a-f]{40}$/.test(expected)) {
            throw new Error('Production installers require a release tag and its full commit SHA');
          }
          const git = async (...args) => (await exec('git', args)).stdout.trim();
          const head = await git('rev-parse', 'HEAD');
          const tagged = await git('rev-parse', `refs/tags/${tag}^{commit}`);
          // electron-builder 的 build-metadata 从根 package.json 取得应用版本。
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          // 手动复验旧 tag 时源码不含新 helper；此处保留可在历史源码上执行的格式校验。
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:\+openzwork\.([1-9]\d*))?$/.exec(version);
          const expectedTag = `v${version}${match?.[4] ? '' : '-openzwork'}`;
          if (!match || match[0] !== version || head !== expected || tagged !== expected || tag !== expectedTag) {
            throw new Error('Release tag, expected commit, checkout and package version must match');
          }
          console.log(JSON.stringify({ tag, sourceCommit: head, version }));
          NODE

      # pacman 的 .MTREE 生成依赖 bsdtar；runner 缺失时 fpm 返回 127，必须显式安装并提前检查。
      - name: Install Linux packaging toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm zstd libarchive-tools

      - name: Verify Linux packaging toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rpmbuild --version
          zstd --version
          bsdtar --version

      # Electron 发行包与 electron-builder 二进制（winCodeSign/NSIS 等）按 lockfile 缓存：
      # pnpm install 的 electron postinstall 与 bundle 的 electron-builder 共用同一缓存位，
      # 命中时省去下载+解包（镜像下载虽仅 ~7s/142MB，Windows 上重复解包仍是可观测开销）。
      - name: Cache electron/electron-builder downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ matrix.electron-cache }}
            ${{ matrix.builder-cache }}
          key: electron-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.platform }}-

      # 与 CI checks 不同：打包需要完整安装（Electron 二进制下载、node-pty 原生重建）。
      - name: Install dependencies (frozen lockfile, with scripts)
        run: pnpm install --frozen-lockfile

      # 导航目录由独立的 TypeScript 项目生成，干净 runner 上没有开发工作区已有的输出。
      - name: Build desktop navigation for packaging
        if: hashFiles('packages/desktop/tsconfig.app-navigation.json') != ''
        run: pnpm exec tsc -b packages/desktop/tsconfig.app-navigation.json

      # bundle = prepare:runtime-assets + 生产构建 + electron-builder + 运行时依赖校验 + 体积审计。
      # ZCODE_SKIP_REMOTE_ASSETS=1：桌面安装包不依赖跨平台 remote 预编译产物（上游 Windows job 同款开关）。
      - name: Package installer (prepare + build + electron-builder)
        run: pnpm --dir packages/desktop bundle --os=${{ matrix.bundle-os }} --arch=${{ matrix.bundle-arch }}
        env:
          ZCODE_SKIP_REMOTE_ASSETS: "1"

      - name: Verify packaged release version
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          if (version.includes('+openzwork.')) {
            const { verifyPackagedVersion } = await import('./scripts/verify-desktop-release-version.mjs');
            console.log(JSON.stringify(await verifyPackagedVersion({ platform: process.env.RELEASE_PLATFORM, version }), null, 2));
          }
          NODE

      # PK01 包内内容检查（CI-FIRST §2.6）：身份/来源绑定/数据根/裁剪域/许可材料/运行时，
      # 结构化报告落盘并进 job summary；buildCommitId 必须绑定本次 checkout。
      - name: Verify packaged contents (PK01)
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          EXPECTED_COMMIT: ${{ inputs.release_commit || inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-desktop-package.mjs --platform "$RELEASE_PLATFORM" --expected-commit "$EXPECTED_COMMIT" --report packages/desktop/dist/PK01-REPORT.json | tee /tmp/pk01-report.json
          {
            echo '### PK01 package contents'
            echo '```json'
            cat /tmp/pk01-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 来源清单（CI-FIRST §2.7）：Preview / production 仅构建 / 正式 tag 三条路由共用
      # scripts/installer-provenance.mjs 的命名与清单逻辑。产品身份、环境后缀、平台/架构
      # 别名都取真实构建期函数——分支 Preview 包实际叫
      # `OpenZWork Preview-<version>-mac-arm64_TEST.dmg`，硬编码 `OpenZWork-<version>-...`
      # 会恒找不到（2026-11-16 复现：Expected at least one dmg installer, found 0）。
      - name: Record build provenance
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_OS: ${{ matrix.bundle-os }}
          RELEASE_ARCH: ${{ matrix.bundle-arch }}
          EXPECTED_COMMIT: ${{ inputs.release_commit || inputs.source_commit || github.sha }}
          IS_RELEASE: ${{ (inputs.release_tag || github.ref_type == 'tag') && '1' || '0' }}
          IS_BUILD_PRODUCTION: ${{ inputs.build_production == true && '1' || '0' }}
          SOURCE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { recordInstallerProvenance } from './scripts/installer-provenance.mjs';
          // 路由判定放在脚本里：YAML 表达式不支持可读的嵌套三元（且 `? :` 会被当映射键）。
          const mode =
            process.env.IS_RELEASE === '1'
              ? 'release'
              : process.env.IS_BUILD_PRODUCTION === '1'
                ? 'build-only'
                : 'preview';
          const version = JSON.parse(await readFile('package.json', 'utf8')).version;
          let versionVerification = null;
          if (mode !== 'preview' && version.includes('+openzwork.')) {
            versionVerification = JSON.parse(await readFile('packages/desktop/dist/VERSION-VERIFICATION.json', 'utf8'));
          }
          const { manifest, fileName } = await recordInstallerProvenance({
            mode,
            platform: process.env.RELEASE_PLATFORM,
            os: process.env.RELEASE_OS,
            arch: process.env.RELEASE_ARCH,
            sourceTag: process.env.SOURCE_TAG,
            expectedCommit: process.env.EXPECTED_COMMIT,
            versionVerification,
          });
          console.log(JSON.stringify({ fileName, manifest }, null, 2));
          NODE
          {
            echo '### Build provenance'
            echo '```json'
            cat packages/desktop/dist/*-MANIFEST.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openzwork-installer-${{ matrix.platform }}
          archive: true
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
            packages/desktop/dist/**/*.dmg
            packages/desktop/dist/**/*.zip
            packages/desktop/dist/**/*.exe
            packages/desktop/dist/**/*.AppImage
            packages/desktop/dist/**/*.deb
            packages/desktop/dist/**/*.rpm
            packages/desktop/dist/**/*.pkg.tar.zst
            packages/desktop/dist/RELEASE-MANIFEST.json
            packages/desktop/dist/PREVIEW-MANIFEST.json
            packages/desktop/dist/BUILD-MANIFEST.json
            packages/desktop/dist/VERSION-VERIFICATION.json
            packages/desktop/dist/PK01-REPORT.json
          if-no-files-found: error

  # OZ-F011：正式 CLI 压缩包直接从 Release 下载。下载根仅供生成 install.sh。
  agent-node-dist:
    if: ${{ !inputs.publish_installer_run }}
    name: agent node dist (${{ matrix.platform }})
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      RELEASE_COMMIT: ${{ inputs.release_commit || (github.ref_type == 'tag' && github.sha) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-amd64
          - os: windows-2022
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: >-
            ${{ (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) ||
            inputs.source_commit || (github.ref_type == 'tag' && github.ref) || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - *verify-dispatch-source
      - *verify-release-source

      - name: Select independent Node distribution mode
        id: cli-dist
        shell: bash
        env:
          DIST_PLATFORM: ${{ matrix.platform }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_URL: ${{ inputs.zcode_dist_base_url }}
          VARS_BASE_URL: ${{ vars.ZCODE_DIST_BASE_URL }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const { EVENT_NAME, RELEASE_TAG, INPUT_BASE_URL, VARS_BASE_URL } = process.env;
          const input = (EVENT_NAME === 'workflow_dispatch' ? INPUT_BASE_URL : VARS_BASE_URL)?.trim();
          const download = input && input !== 'https://example.invalid/zcode/deps/zcode/';
          // 启用独立包的源码始终构建本平台附件；历史版本沿用既有下载目标。
          const mode = pkg.openzworkRelease?.cliArchives === true
            ? (download && process.env.DIST_PLATFORM !== 'windows-amd64' ? 'both' : 'archive')
            : (process.env.DIST_PLATFORM === 'windows-amd64' || (RELEASE_TAG && !download) ? 'skip' : 'download');
          console.log(`mode=${mode}`);
          NODE

      - name: Install dependencies (frozen lockfile, with scripts)
        if: steps.cli-dist.outputs.mode != 'skip'
        run: pnpm install --frozen-lockfile

      # 有下载根的构建输出安装脚本。分支预览沿用默认占位地址。
      - name: Resolve agent dist download base URL
        if: steps.cli-dist.outputs.mode == 'download' || steps.cli-dist.outputs.mode == 'both'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_BASE_URL: ${{ inputs.zcode_dist_base_url }}
          DIST_RELEASE_TAG: ${{ inputs.release_tag }}
          VARS_BASE_URL: ${{ vars.ZCODE_DIST_BASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { resolveAgentDistBaseUrl } from './scripts/agent-node-dist.mjs';
          const resolved = resolveAgentDistBaseUrl({
            eventName: process.env.EVENT_NAME,
            refType: process.env.REF_TYPE,
            inputs: { zcode_dist_base_url: process.env.INPUT_BASE_URL ?? '', release_tag: process.env.DIST_RELEASE_TAG },
            vars: { ZCODE_DIST_BASE_URL: process.env.VARS_BASE_URL ?? '' },
          });
          console.error(`agent dist base URL source: ${resolved.source}`);
          console.log(`AGENT_DIST_BASE_URL=${resolved.baseUrl}`);
          console.log(`AGENT_DIST_BASE_URL_SOURCE=${resolved.source}`);
          NODE

      # 与 B/C 本地构建同链：先备 shared 声明与 CLI 包，再 build:zcode 出 tarball。
      - name: Prepare agent workspace build
        if: steps.cli-dist.outputs.mode != 'skip'
        run: pnpm build:sea:prepare

      - name: Build independent Node distribution
        if: steps.cli-dist.outputs.mode != 'skip'
        shell: bash
        env:
          DIST_MODE: ${{ steps.cli-dist.outputs.mode }}
        run: |
          case "$DIST_MODE" in
            archive) pnpm build:zcode --archive-only --out-dir dist/zcode ;;
            both)
              pnpm build:zcode --base-url "$AGENT_DIST_BASE_URL" --out-dir dist/zcode-download
              pnpm build:zcode --skip-build --archive-only --out-dir dist/zcode
              ;;
            download) pnpm build:zcode --base-url "$AGENT_DIST_BASE_URL" ;;
          esac

      # 产物选择与来源清单：与本次版本唯一对应的 tarball，附 source/tree/workflow SHA、
      # 平台、工具链与 hash；不用 `find | head -1` 忽略多产物。
      - name: Verify agent node dist contents
        if: steps.cli-dist.outputs.mode != 'skip'
        shell: bash
        env:
          DIST_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TARBALL=$(node scripts/agent-node-dist.mjs --release-root "dist/zcode/releases/$VERSION" --version "$VERSION")
          export VERSION TARBALL
          mkdir -p dist/agent-node-dist
          platform_args=()
          if [ "${{ steps.cli-dist.outputs.mode }}" != 'download' ]; then platform_args=(--expected-platform "$DIST_PLATFORM"); fi
          node scripts/verify-agent-node-dist.mjs "${platform_args[@]}" --tarball "$TARBALL" --expected-version "$VERSION" --report dist/agent-node-dist/AGENT-DIST-REPORT.json
          if [ "${{ steps.cli-dist.outputs.mode }}" != 'download' ]; then
            node scripts/zcode-distribution-smoke.mjs "$TARBALL"
          else
            # 旧版 HTTP 启动器使用显式凭据来源。测试值仅在该进程树内有效。
            env -u ZCODE_CREDENTIAL_SECRET_FILE ZCODE_CREDENTIAL_SECRET="$(node -p "require('node:crypto').randomBytes(32).toString('hex')")" \
              node scripts/zcode-distribution-smoke.mjs "$TARBALL"
          fi
          cp "$TARBALL" "dist/zcode/releases/$VERSION/sha256.txt" dist/agent-node-dist/
          PNPM_VERSION=$(pnpm --version)
          export PNPM_VERSION
          node --input-type=module <<'NODE' | tee /tmp/agent-dist-manifest.json
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { writeAgentDistManifest } from './scripts/agent-node-dist.mjs';
          const exec = promisify(execFile);
          const git = async (...args) => (await exec('git', args)).stdout.trim();
          const { manifest } = await writeAgentDistManifest({
            releaseRoot: 'dist/agent-node-dist',
            tarball: process.env.TARBALL,
            version: process.env.VERSION,
            platform: process.env.DIST_PLATFORM,
            baseUrl: process.env.AGENT_DIST_BASE_URL,
            baseUrlSource: process.env.AGENT_DIST_BASE_URL_SOURCE,
            sourceCommit: await git('rev-parse', 'HEAD'),
            sourceTree: await git('rev-parse', 'HEAD^{tree}'),
            workflowCommit: process.env.GITHUB_WORKFLOW_SHA,
            nodeVersion: process.version,
            pnpmVersion: process.env.PNPM_VERSION ?? '',
          });
          console.log(JSON.stringify(manifest, null, 2));
          NODE
          {
            echo '### Agent Node distribution'
            echo '```json'
            cat /tmp/agent-dist-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 验收成功后上传实际运行包与报告，发布器按同一运行的归档读取。
      - name: Upload agent node distribution
        if: steps.cli-dist.outputs.mode != 'skip'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-node-dist-${{ matrix.platform }}
          archive: true
          path: dist/agent-node-dist/
          if-no-files-found: error

  publish:
    # production 仅构建路由（build_production）永不进入发布：它只产出未签名验收包。
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_installer_run != '' && inputs.build_production != true }}
    name: Publish verified release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: openzwork-release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
      - name: Verify and publish existing installers
        run: node scripts/publish-github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          INSTALLERS_RUN: ${{ inputs.publish_installer_run }}
          CORE_RUN: ${{ inputs.core_run }}
          EXTENDED_RUN: ${{ inputs.extended_run }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
