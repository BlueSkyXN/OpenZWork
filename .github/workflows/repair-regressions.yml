name: Repair regressions

on:
  workflow_dispatch:

concurrency:
  group: repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies without runtime scripts
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Windows NSIS shortcut smoke
        run: node packages/desktop/scripts/test-installer-nsh-smoke.mjs
      - name: Build workspace declarations
        id: declarations
        if: always() && steps.install.outcome == 'success'
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Process and Windows regressions
        id: tests
        if: always() && steps.declarations.outcome == 'success'
        run: pnpm exec vitest run packages/desktop/test/subagentConfigProxy.test.ts packages/services/test/skillsService.test.ts packages/services/test/subagentRuntimeConfig.test.ts packages/provider-node/test/bundled-config-replacement.test.ts packages/zcode-server-cli/test/componentArchiveProcess.test.ts packages/zcode-server-cli/test/cli.test.ts packages/zcode-server-cli/test/daemonRegistration.test.ts packages/server/test/remoteAssetInstaller.test.ts --reporter=default --reporter=json --outputFile=.run-logs/repair-tests.json
      - name: Upload regression results
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repair-tests-windows
          path: .run-logs/repair-tests.json
          archive: true
          if-no-files-found: error
