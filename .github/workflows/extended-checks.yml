name: Extended checks (non-blocking)
run-name: ${{ github.ref_type == 'tag' && format('Release {0} / {1}', github.ref_name, github.workflow) || '' }}

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-openzwork", "v*openzwork.*"]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Immutable source commit to validate (empty uses the event commit)
        type: string
        default: ""
      repair:
        description: Run only the focused Windows repair regressions
        type: boolean
        default: false

env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}

concurrency:
  group: extended-${{ github.workflow }}-${{ inputs.source_commit || github.ref }}
  cancel-in-progress: true

jobs:
  historical-tests:
    if: inputs.repair != true
    name: full suite shard (${{ matrix.platform }}, ${{ matrix.shard }})
    env:
      EXTENDED_TEST_PLATFORM: ${{ matrix.platform }}
      EXTENDED_TEST_SHARD: ${{ matrix.shard }}
      # 原生 SQLite/归档测试在 Windows threads 中多次零散超时，使用已有进程池模式。
      ZCODE_TEST_POOL: ${{ matrix.platform == 'windows-amd64' && 'forks' || 'threads' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 退役演练会在步骤执行前取消作业；macos-15 延续 arm64 runner。
          - os: macos-15
            platform: macos-arm64
            shard: ui-and-web
          - os: macos-15
            platform: macos-arm64
            shard: services-and-supporting
          - os: windows-latest
            platform: windows-amd64
            shard: services
          - os: windows-latest
            platform: windows-amd64
            shard: supporting
          - os: windows-latest
            platform: windows-amd64
            shard: ui-and-web-1
          - os: windows-latest
            platform: windows-amd64
            shard: ui-and-web-2
          - os: ubuntu-latest
            platform: linux-amd64
            shard: services
          - os: ubuntu-latest
            platform: linux-amd64
            shard: ui-and-web
          - os: ubuntu-latest
            platform: linux-amd64
            shard: supporting
    runs-on: ${{ matrix.os }}
    # 最长的 macOS 六组合并保持各组原期限；正常耗时与上限均由实跑监控。
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      # 固定旧源码复验时，调度器仍使用本次工作流版本。
      - name: Checkout workflow tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Record validation source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFile } from 'node:child_process';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          const git = async (...args) => (await exec('git', args)).stdout.trim();
          const expected = process.env.SOURCE_COMMIT || '';
          const sourceCommit = await git('rev-parse', 'HEAD');
          if (expected && (!/^[a-f0-9]{40}$/.test(expected) || sourceCommit !== expected)) {
            throw new Error('Validation checkout must match the full requested source commit');
          }
          const record = { sourceCommit, sourceTree: await git('rev-parse', 'HEAD^{tree}'), workflowCommit: process.env.GITHUB_WORKFLOW_SHA, testPool: process.env.ZCODE_TEST_POOL || null, platform: process.env.EXTENDED_TEST_PLATFORM || null, shard: process.env.EXTENDED_TEST_SHARD || null, runId: process.env.GITHUB_RUN_ID || null };
          await mkdir('.run-logs/full-groups', { recursive: true });
          await writeFile('.run-logs/full-groups/source.json', JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify(record));
          NODE

      # 完整历史测试包含真实 Electron 字节码等运行时测试，执行依赖安装脚本。
      - name: Install dependencies with runtime scripts
        run: pnpm install --frozen-lockfile

      - name: Build workspace declarations
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Cache turbo task outputs
        uses: actions/cache@v6.1.0
        with:
          path: apps/zcode-cli/.turbo
          key: turbo-${{ runner.os }}-${{ inputs.source_commit || github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Prepare Agent workspace
        working-directory: apps/zcode-cli
        env:
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: npx --yes turbo@2.9.14 run typecheck --cache-dir=.turbo

      - name: Build CLI and required MCP runtimes
        run: node scripts/build-desktop-agent-cli.mjs

      - name: Build remote server bundle
        run: pnpm --filter @zcode/server build:remote

      - name: Full historical unit suite (grouped)
        id: full_tests
        # 分片内部保留组级时限与串行执行；独立 runner 提供并行。
        run: node .ci-tools/scripts/run-full-suite-groups.mjs --shard=${{ matrix.shard }}

      - name: Upload full suite results
        if: always() && steps.full_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: extended-shard-${{ matrix.platform }}-${{ matrix.shard }}
          path: .run-logs/full-groups/
          archive: true
          overwrite: true
          if-no-files-found: error

  historical-results:
    if: always() && inputs.repair != true
    needs: historical-tests
    name: full suite (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXTENDED_TEST_PLATFORM: ${{ matrix.platform }}
      ZCODE_TEST_POOL: ${{ matrix.platform == 'windows-amd64' && 'forks' || 'threads' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, windows-amd64, linux-amd64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Checkout workflow tools
        id: tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0

      - name: Record validation source
        id: source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFile } from 'node:child_process';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          const git = async (...args) => (await exec('git', args)).stdout.trim();
          const expected = process.env.SOURCE_COMMIT || '';
          const sourceCommit = await git('rev-parse', 'HEAD');
          if (expected && (!/^[a-f0-9]{40}$/.test(expected) || sourceCommit !== expected)) {
            throw new Error('Validation checkout must match the full requested source commit');
          }
          const record = { sourceCommit, sourceTree: await git('rev-parse', 'HEAD^{tree}'), workflowCommit: process.env.GITHUB_WORKFLOW_SHA, testPool: process.env.ZCODE_TEST_POOL || null, platform: process.env.EXTENDED_TEST_PLATFORM || null, shard: process.env.EXTENDED_TEST_SHARD || null, runId: process.env.GITHUB_RUN_ID || null };
          await mkdir('.run-logs/full-groups', { recursive: true });
          await writeFile('.run-logs/full-groups/source.json', JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify(record));
          NODE
      - name: Download platform shards
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: extended-shard-${{ matrix.platform }}-*
          path: .run-logs/extended-shards
          merge-multiple: false
      - name: Validate and merge full suite reports
        id: merge
        if: always() && steps.source.outcome == 'success' && steps.tools.outcome == 'success'
        run: node .ci-tools/scripts/merge-full-suite-reports.mjs
      - name: Upload full suite results
        if: always() && steps.merge.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: extended-tests-${{ matrix.platform }}
          path: .run-logs/full-groups/
          archive: true
          overwrite: true
          if-no-files-found: error

  desktop-main-audit:
    if: inputs.repair != true
    name: Desktop Main baseline audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Record validation source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFile } from 'node:child_process';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          const git = async (...args) => (await exec('git', args)).stdout.trim();
          const expected = process.env.SOURCE_COMMIT || '';
          const sourceCommit = await git('rev-parse', 'HEAD');
          if (expected && (!/^[a-f0-9]{40}$/.test(expected) || sourceCommit !== expected)) {
            throw new Error('Validation checkout must match the full requested source commit');
          }
          const record = { sourceCommit, sourceTree: await git('rev-parse', 'HEAD^{tree}'), workflowCommit: process.env.GITHUB_WORKFLOW_SHA, testPool: process.env.ZCODE_TEST_POOL || null, platform: process.env.EXTENDED_TEST_PLATFORM || null, shard: process.env.EXTENDED_TEST_SHARD || null, runId: process.env.GITHUB_RUN_ID || null };
          await mkdir('.run-logs/full-groups', { recursive: true });
          await writeFile('.run-logs/full-groups/source.json', JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify(record));
          NODE
      - name: Install dependencies without runtime scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build workspace declarations
        id: declarations
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Prepare diagnostic directory
        run: node --input-type=module -e "import { mkdir } from 'node:fs/promises'; await mkdir('.run-logs', { recursive:true });"
      - name: Audit Desktop Main types
        id: main_audit
        run: pnpm exec tsc -p packages/desktop/tsconfig.main.json --noEmit --pretty false > .run-logs/desktop-main-typecheck.log 2>&1
      - name: Upload Main diagnostics
        if: always() && steps.main_audit.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-main-diagnostics
          path: .run-logs/desktop-main-typecheck.log
          archive: true
          if-no-files-found: error
      - name: Audit Desktop E2E types
        id: e2e_audit
        if: always() && steps.declarations.outcome == 'success'
        run: pnpm exec tsc -p packages/desktop/tsconfig.e2e.json --noEmit --pretty false > .run-logs/desktop-e2e-typecheck.log 2>&1
      - name: Upload E2E type diagnostics
        if: always() && steps.e2e_audit.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-e2e-diagnostics
          path: .run-logs/desktop-e2e-typecheck.log
          archive: true
          if-no-files-found: error

  windows-repair:
    if: inputs.repair == true
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.28.6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Record validation source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFile } from 'node:child_process';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          const git = async (...args) => (await exec('git', args)).stdout.trim();
          const expected = process.env.SOURCE_COMMIT || '';
          const sourceCommit = await git('rev-parse', 'HEAD');
          if (expected && (!/^[a-f0-9]{40}$/.test(expected) || sourceCommit !== expected)) {
            throw new Error('Validation checkout must match the full requested source commit');
          }
          const record = { sourceCommit, sourceTree: await git('rev-parse', 'HEAD^{tree}'), workflowCommit: process.env.GITHUB_WORKFLOW_SHA, testPool: process.env.ZCODE_TEST_POOL || null, platform: process.env.EXTENDED_TEST_PLATFORM || null, shard: process.env.EXTENDED_TEST_SHARD || null, runId: process.env.GITHUB_RUN_ID || null };
          await mkdir('.run-logs/full-groups', { recursive: true });
          await writeFile('.run-logs/full-groups/source.json', JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify(record));
          NODE
      - name: Install dependencies without runtime scripts
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Windows NSIS shortcut smoke
        run: node packages/desktop/scripts/test-installer-nsh-smoke.mjs
      - name: Build workspace declarations
        id: declarations
        if: always() && steps.install.outcome == 'success'
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Process and Windows regressions
        id: tests
        if: always() && steps.declarations.outcome == 'success'
        run: pnpm exec vitest run packages/ui/test/subagentsSection.test.ts packages/desktop/test/subagentConfigProxy.test.ts packages/services/test/skillsService.test.ts packages/services/test/subagentRuntimeConfig.test.ts packages/services/test/subagentRuntimeConfigWatcher.test.ts packages/services/test/zcodeAgentProcessManager.test.ts packages/services/test/processTreeLineage.test.ts packages/services/test/processTreeTerminator.windows.test.ts packages/services/test/zcodeAgentService.v4.test.ts packages/provider-node/test/bundled-config-replacement.test.ts packages/zcode-server-cli/test/componentArchiveProcess.test.ts packages/zcode-server-cli/test/cli.test.ts packages/zcode-server-cli/test/daemonRegistration.test.ts packages/zcode-server-cli/test/supervisor.test.ts packages/server/test/remoteAssetInstaller.test.ts --reporter=default --reporter=json --outputFile=.run-logs/repair-tests.json
      - name: Upload regression results
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repair-tests-windows
          path: .run-logs/repair-tests.json
          archive: true
          if-no-files-found: error
