# pnpm 11 在 run 前触发依赖校验安装；本内层 workspace 解析不到外层 packages/*
# （如 @zcode/model-option-map），且 hoisted 布局下校验安装会把包内直接依赖
# （contracts 的 zod@3.25.76）挪进 node_modules/.ignored/ 导致类型解析漂移到根的
# zod@4.6.5。统一关闭；恢复由根 postinstall scripts/restore-inner-hoisted-deps.mjs 兜底。
verifyDepsBeforeRun: false

packages:
  - "packages/*"
  - "tools/*"

supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
