    regression:
      - packages/desktop/test/webRemoteControlManagerExternalRelay.test.ts
    retire: 官方 V1 兼容路径采用包含时间字段的等效去重实现，或该旧协议支持经产品决定撤销；保留重复快照及 bootstrap 一致性回归。
    refs:
      - docs/web-remote-control/v1-connection-modes.md

  - id: OW-P010
