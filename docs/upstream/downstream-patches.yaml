  - id: OW-P014
    title: 数据目录锁的初始化空文件被竞争者回收
    kind: product
    status: fixed
    upstream:
      since: 3.16.2
      checked: 3.16.2
    trigger: 多进程取得同一数据目录锁，首次 open(wx) 已创建文件但 owner 尚未写入，或陈旧锁恢复与首次取得交错。
    impact: 两个进程可能同时认为自己持有数据目录锁，真实八进程竞争回归出现两个 success。
    cause: 首次取得不受 recovery 门闩保护，空记录被当作损坏锁回收；旧单文件 recovery 门闩自身也存在创建与写入分离的窗口。
    fix: 首次取得和陈旧恢复统一在 shared/node 的 acquireFileLock 门闩内完成，保留原 server.lock 格式、ownerToken 校验和公开接口，门闩保持 5ms 重试间隔与 500ms 等待预算。
    evidence: Linux Extended 的八进程竞争报告两个 success；上游 3.16.2 的 3c5b2276 包含相同代码。精确暂停首次 open 后，原实现允许第二个 owner 成功；修复后拒绝竞争者，放行后首个 owner 正常取得。原陈旧恢复和真实多进程回归保留。
    files:
      - packages/zcode-server-cli/src/runtime/lock.ts
    regression:
      - packages/zcode-server-cli/test/lock.test.ts
    retire: 上游对首次取得与陈旧恢复提供等效互斥，初始化中的记录不会被误回收，真实多进程竞争及 ownerToken 保护回归保留。
    refs:
      - docs/spec/source-server-lock-acquisition.md
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/40410464216/job/121879570233

  - id: OW-P015
    title: 交互浮层重叠窗口拖拽区时无法点击
    kind: product
    status: fixed
    priority: P2
    upstream:
      since: 3.16.2
      checked: 3.16.2
    trigger: 项目搜索菜单向上展开，或其他交互浮层、子菜单覆盖桌面窗口的标题栏拖拽区。
    impact: 搜索框无法通过鼠标聚焦，浮层内按钮和菜单项的点击可能被当成拖动窗口。
    cause: DropdownMenu、ContextMenu、Popover 和 HoverCard 的共享内容根缺少 no-drag；Portal 的视觉层级不能排除 Electron 原生拖拽命中。
    fix: 在四个共享组件的六处内容根声明 no-drag，覆盖主浮层与子菜单；调用方继续保留布局、搜索、焦点和选择逻辑，窗口其余拖拽区域不变。
    evidence: 上游 3.16.2 的 3c5b2276 保留相同缺口。四组共享组件回归在原实现下失败；原生鼠标复现中，输入框重叠拖拽区时按 x 只会选中菜单项。修复后的共享 DropdownMenu 在隔离 Electron 中可通过鼠标聚焦并连续输入 xrag；六类浮层的 24 个浏览器场景验证实际 CSS、输入过滤和动作选择。
    files:
      - packages/ui/src/components/ui/dropdown-menu.tsx
      - packages/ui/src/components/ui/context-menu.tsx
      - packages/ui/src/components/ui/popover.tsx
      - packages/ui/src/components/ui/hover-card.tsx
    regression:
      - packages/ui/test/floatingLayerHitRegions.test.ts
    retire: 上游在共享交互浮层及子菜单中提供等效原生非拖拽区域，重叠标题栏时的输入与动作回归通过。
    refs:
      - DESIGN.md
      - packages/ui/test/browser/manual-review/pending/floating-layer-hit-regions.test.mjs

  - id: OW-P016
    title: 高优先级项目 MCP 配置丢弃前一层的不同名 server
    kind: product
    status: fixed
    priority: P2
    upstream:
      since: 3.16.2
      checked: 3.16.2
    trigger: 用户与项目、父项目与子项目或兼容配置文件分别声明 MCP server。
    impact: 后一份 mcp 对象覆盖前一层，未被同名覆盖的 server 也从有效配置中消失。
    cause: mergeConfigs 先 Object.assign(result, config)，随后才读取 result.mcp.servers 作为旧层，实际读取的已是新层。
    fix: 在 Object.assign 前保留 previousMcp，合并不同名 server；同名项按高优先级整份替换，不拼接 command、args 或 env。
    evidence: 上游 3.16.2 的 3c5b2276 含相同先覆盖后读取代码；真实临时项目配置回归验证不同名保留、同名完整替换、禁用状态及源文件不变。
    files:
      - apps/zcode-cli/packages/adapters/src/config/config-merger.ts
    regression:
      - apps/zcode-cli/packages/adapters/tests/project-config-compatibility.test.ts
    retire: 上游在覆盖前保留旧 MCP 层，项目叠加回归中不同名 server 均可见且同名定义不混合。
    refs:
      - docs/spec/identity-and-data-isolation.md

  - id: OW-P017
    title: 本地远控新建在目录失效时仍交付 Host attachment
    kind: product
    status: fixed
    upstream:
      since: 3.16.2
      checked: 3.16.2
    trigger: 手机通过旧 workspace 入口在已删除、不可访问或已变成文件的本地目录中新建任务。
    impact: 新建入口绕过原生项目目录检查，错误继续到会话初始化，目录缺失原因无法在 admission 时反馈。
    cause: attachWorkspaceHost 的 local 分支不读取 cwd，直接交付窗口 Host port。
    fix: 新草稿在创建 port 前异步检查目录及访问权限，失败时明确提示恢复或选择目录；历史 initialTaskId 保留读取能力，不创建或修补旧目录。
    evidence: 上游 3.16.2 的 3c5b2276 含相同直接 attachment 分支。真实临时目录回归在原实现下收到成功 attachment，修复后拒绝缺目录与文件路径，未产生 port 或 mkdir，目录恢复后可重试。
    files:
      - packages/desktop/src/main/webRemoteControlSharedHostAttachments.ts
    regression:
      - packages/desktop/test/webRemoteControlSharedHostAttachments.test.ts
    retire: 上游新草稿 admission 执行等效目录检查，历史读取与目录恢复回归保持通过。
    refs:
      - docs/web-remote-control/v1-connection-modes.md

