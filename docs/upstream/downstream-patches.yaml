    regression:
      - apps/zcode-cli/packages/adapters/tests/bash-direct-execution.test.ts
    retire: 上游明确区分真实 shell 集成测试预算与命令执行期限，并保留成功状态、退出码、完整输出和编码解析次数断言。
    refs:
      - docs/testing/pre-push-hook.md
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/40314941762/job/121545062554

  - id: OW-P011
    title: 录屏编码超时单测将真实帧准备时间计入竞争期限
    kind: test
    status: fixed
    upstream:
      since: 3.15.1
      checked: 3.16.2
    trigger: 自定义编码器永不结束的单测中，抓帧、写文件和整理帧序列消耗 stop 总预算，编码器的 30ms 期限尚未先到。
    impact: Windows Extended 期望编码超时，却收到 stop 在 100ms 到期的错误；正常的总预算保护被误报为编码器测试失败。
    cause: 上游夹具同时使用真实文件 IO、30ms 编码期限与 100ms stop 总期限，未在编码器实际进入后控制时钟。
    fix: 使用受控时钟并等待编码器进入信号，断言 29ms 尚未结束、30ms 报编码超时且取消信号；保留原期限及独立的 stop 总预算和真实子进程回归，加入核心套件。
    evidence: 3.15.1 和 3.16.2 源码均保留竞争期限。Windows 日志报告 stop100ms 先于 encode30ms；阻塞第二帧捕获的控制实验在编码器尚未调用时稳定复现 stop100ms，修复后的编码边界回归以受控时钟执行。
    files:
      - packages/desktop/test/e2eElectronWindowRecorder.test.ts
    regression:
      - packages/desktop/test/e2eElectronWindowRecorder.test.ts
    retire: 上游编码超时夹具等待真实编码阶段并独立控制时钟，编码、stop 与真实命令终止回归均保留。
    refs:
      - docs/testing/pre-push-hook.md
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/40363690020/job/121715543138

  - id: OW-P012
    title: 冷恢复夹具每例重复完整建库迁移
    kind: test
    status: fixed
    upstream:
      since: 3.16.2
      checked: 3.16.2
    trigger: 真实 SQLite 冷恢复用例的完整建库、播种历史与恢复共用默认 5 秒预算，Windows 文件准备发生波动。
    impact: 单 worker 下仍出现用例超时，随后 afterEach 删除尚未释放的数据库时报 EBUSY。
    cause: 每例从空文件执行全部 schema 迁移，重复准备与被测恢复语义耦合；原超时日志没有细分阶段，具体该次慢点未确认。
    fix: beforeAll 通过当前迁移生成并关闭空库模板，每例排他复制独立数据库，保留真实写入、关库重开、App 与协议恢复、默认 5 秒期限和显式旧格式迁移。
    evidence: 上游 3.16.2 的 3c5b2276 保留每例新建完整数据库。Windows 定向 20 轮共 60 个目标用例通过，建库中位 66ms、最大 1177ms；40 次订阅最大 30ms，App 创建最大 33ms。回归要求副本不重跑完整迁移且各副本与空模板数据隔离，恢复旧建库方式时因仍执行完整迁移而失败。
    files:
      - apps/zcode-cli/packages/bootstrap/tests/v4-cold-resume.test.ts
    regression:
      - apps/zcode-cli/packages/bootstrap/tests/v4-cold-resume.test.ts
    retire: 上游采用已关闭模板或等效隔离准备，恢复断言继续使用真实持久化与原期限，并保留空模板和副本隔离回归。
    refs:
      - docs/spec/ci-cold-resume-fixtures.md
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/40391057695/job/121811837803
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/40395050403

  - id: OW-P013
    title: Supervisor 最终状态在原子替换暂时失败后丢失
    kind: product
    status: fixed
    upstream:
      since: 3.16.2
      checked: 3.16.2
    trigger: Windows 读取状态文件期间，Supervisor 原子替换最终 stopped 快照返回 EPERM、EBUSY 或 EACCES。
    impact: Supervisor 已停止并释放锁，但持久化快照仍是旧状态，要求新 stopped 快照的等待方持续等待并超时。
    cause: status persister 只做一次 rename，错误记录后继续结束生命周期，最终状态没有后续写入机会。
    fix: 既有串行队列复用 shared/node 的 atomicWritePrivateTextFile，针对共享占用有界重试并清理失败临时文件；保留旧快照、永久错误上报、状态格式及全部停机期限。
    evidence: Windows Extended 日志在 slow SIGKILL reap 用例记录最终 status rename EPERM，随后 20000ms 超时；上游 3.16.2 的 3c5b2276 同样只尝试一次 rename。六项故障注入回归在原实现下失败，覆盖短暂占用、持续占用、不可重试错误、旧快照保护和后续队列恢复。
    files:
      - packages/zcode-server-cli/src/runtime/statusSnapshot.ts
    regression:
      - packages/zcode-server-cli/test/supervisor.test.ts
    retire: 上游状态原子替换采用等效有界共享占用处理，最终快照可被停机等待方观测，永久失败与队列顺序回归仍保留。
    refs:
      - docs/spec/source-server-status-persistence.md
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/40398952165/job/121839361291
