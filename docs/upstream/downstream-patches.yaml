    kind: test
    status: fixed
    upstream:
      since: 3.16.2
      checked: 3.16.2
    trigger: Windows Git Bash 编码回归的夹具准备、真实进程启动和结果读取合计超过默认 5 秒。
    impact: 命令自身 10 秒期限尚未结束，Vitest 已先中止测试，主分支 Windows CI 失败。
