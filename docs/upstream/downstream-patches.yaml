      checked: 3.16.2
    trigger: 任务标题、状态和未读等字段不变，仅活动时间变化，或同活动时间的创建时间变化。
    impact: 手机保留旧任务时间和排序，直到其他已比较字段变化或重新获取完整目录。
    cause: 旧协议目录按 updatedAt 和 createdAt 排序，但推送签名遗漏两个时间字段，且签名排序会消除输入数组的顺序变化。
