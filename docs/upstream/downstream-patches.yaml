  - id: OW-P005
    title: MCP 写入失败仍更新界面状态
    kind: product
    status: fixed
    priority: P2
    upstream:
      since: 3.15.1
      checked: 3.16.2
    trigger: MCP 目录服务缺失或新增、修改、启停、删除请求失败。
    impact: 新增和修改显示未保存的配置，开关错误改变，删除提前移除条目；调用方无法一致处理失败。
    cause: store 吞掉持久化异常后更新投影，删除及预载入口没有等待写入结果。
    fix: 所有 mutation 等待统一持久化入口，失败 reject 且保留原投影；设置页捕获错误，当前目标成功才执行完成动作。
    evidence: 修复前受控写入回归失败，修复后新增、修改、启停、删除、缺服务及预载失败回归通过；本机平台返回失败也不更新投影。
    files:
      - packages/ui/src/store/mcpStore.ts
      - packages/ui/src/settings/McpSettingsSection.tsx
      - packages/desktop/test/e2e/settings/manual-review/pending/mcp-mutation-errors.test.ts
    regression:
      - packages/ui/test/mcpStoreMutations.test.ts
    retire: 上游所有 MCP 写入入口都向调用方返回失败，失败时原界面及持久化标记保持。
    refs:
      - docs/spec/maintenance-fixes-3.16.2.md
      - https://github.com/BlueSkyXN/OpenZWork/pull/31

  - id: OW-P006
    title: MCP 迟到的保存结果污染新 Source 配置投影
    kind: product
    status: fixed
    priority: P1
    upstream:
      since: 3.15.1
      checked: 3.16.2
    trigger: Source A 保存挂起期间切换 B、切走再切回 A，或更换同 Source 的目录服务。
    impact: 原目标的配置可能写入新目标的共享 store，并进入新目标的 Agent 状态刷新请求。
    cause: 异步写入完成后直接修改当前投影，没有核对操作开始时的目标和服务代次。
    fix: 捕获目标服务与代次，切换或重连推进代次；读取与写回丢弃过期结果，重置旧目标开关投影；界面完成动作核对目标令牌。
    evidence: A→B、A→B→A、同 Source 重连回归覆盖四种 mutation；状态刷新请求不含合成 A 标记，旧代理读取与批量预载不会污染新目标。
    files:
      - packages/ui/src/store/mcpStore.ts
      - packages/ui/src/settings/McpSettingsSection.tsx
    regression:
      - packages/ui/test/mcpStoreMutations.test.ts
    retire: 上游对 MCP 写回及界面完成动作检查目标代次，切换和重连回归不再污染配置投影。
    refs:
      - docs/spec/maintenance-fixes-3.16.2.md
      - https://github.com/BlueSkyXN/OpenZWork/pull/31

  - id: OW-P007
    title: Bot 消息流 HTTP 测试桩被后台轮询消费
    kind: test
    status: fixed
    upstream:
      since: 3.16.2
      checked: 3.16.2
    trigger: 消息流测试创建默认启用后台任务的 Bot 服务，同时把全局 HTTP 替换为立即成功的响应。
    impact: 微信 getupdates 可连续取得空响应并累积 mock 调用；消息流单测存在不受其断言控制的后台请求。
    cause: 消息处理与后台渠道生命周期没有在测试夹具中隔离，且每例同步 disposeAll 后未等待异步清理完成。
    fix: 消息流工厂默认关闭后台任务，启动用例显式开启；每例等待 disposeAllAndWait，并断言 HTTP 替身没有消费微信后台轮询。
    evidence: 上游 3.16.2 夹具没有设置 runStartupBackgroundTasks；真实服务/provider 与临时目录的受控实验在 18ms 内产生 100 次空轮询。历史 worker OOM 无堆快照，不逐次断言均由此触发。
    files:
      - packages/services/test/botsService.messageFlow.test.ts
    regression:
      - packages/services/test/botsService.messageFlow.test.ts
    retire: 上游消息流夹具隔离后台任务并等待服务清理，现有消息断言与无意外轮询检查全部通过。
    refs:
      - docs/spec/maintenance-fixes-3.16.2.md
      - https://github.com/BlueSkyXN/OpenZWork/pull/32

  - id: OW-P008
    title: RPC 资源样本测试在订阅完成前发送一次性事件
    kind: test
    status: fixed
    upstream:
      since: 3.15.1
      checked: 3.16.2
    trigger: RPC 初始化和 EventListen 队列传播超过测试固定等待的 20ms。
    impact: 样本在服务端监听器注册前丢失，测试等待已丢失事件直至 30 秒超时，阻断完整检查。
    cause: 夹具把固定睡眠当作动态事件已订阅的证据，而内存协议通过异步队列传递请求。
    fix: 等待服务端 Emitter 首个监听器的注册信号再发送样本；覆盖即时与 50ms 队列延迟，保持完整载荷断言和原时限。
    evidence: 上游 3.16.2 保留 20ms 固定等待；macOS Extended 该用例超时。受控 50ms 队列延迟在旧等待逻辑下复现 30 秒超时，修复后两种延迟及相邻 RPC 回归通过。
    files:
      - packages/services/test/zcodeAgentResourceTelemetry.rpc.test.ts
    regression:
      - packages/services/test/zcodeAgentResourceTelemetry.rpc.test.ts
    retire: 上游夹具以真实订阅信号代替固定等待，即时与延迟队列下的样本载荷回归均通过。
    refs:
      - docs/spec/automatic-github-release.md
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/40189299521/job/121156666989
      - https://github.com/BlueSkyXN/OpenZWork/pull/36

  - id: OW-P009
