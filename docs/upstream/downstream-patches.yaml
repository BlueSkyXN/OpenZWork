# OpenZWork 下游补丁清单：字段、状态与维护流程见 docs/spec/downstream-patch-registry.md。
# 由 tests/ci/downstream-patches.test.mjs 校验。
version: 1
patches:
  - id: OW-P001
    title: 远端 Source 的用户级 MCP 设置读写本机配置
    kind: product
    status: fixed
    priority: P1
    upstream:
      since: 3.16.1
      checked: 3.16.2
    trigger: 在本机工作区打开设置，选择远端 Source 的用户级 MCP，读取或保存配置。
    impact: 读取和保存都落到本机用户配置，远端 Source 的配置没有变化。
    cause: Source 用户级目标只设置 workspacePath，没有 workspaceIdentity；mcpStore 在 identity 为空时忽略设置页显式传入的远端目录服务，回落到本机平台读写。
    fix: MCP store 将所选目标的目录服务与 authority 一起保存；Source 用户级读写使用该服务，重连时更新引用，缺少服务时失败；普通本机工作区继续走平台和旧配置迁移。
    evidence: 修复前，真实 mcpStore 缺少 workspaceIdentity 时只调用本机服务。修复后，Source 用户级读取、保存和启停只调用所选目录服务；同路径切换、同目标重连、缺少服务失败及原本机迁移回归通过。
    files:
      - packages/ui/src/store/mcpStore.ts
    regression:
      - packages/ui/test/mcpStore.test.ts
    retire: 上游让 Source 用户级目标经远端目录服务读写，原触发场景只调用远端服务。
    refs:
      - docs/spec/maintenance-fixes-3.16.2.md
      - https://github.com/BlueSkyXN/OpenZWork/commit/0a1fc56d279fd1001f78387bd81aec1c26767411

  - id: OW-P002
    title: 含 +、/、= 的 Web 访问令牌无法通过 Cookie 鉴权
    kind: product
    status: fixed
    priority: P2
    upstream:
      since: 3.14.0
      checked: 3.16.2
    trigger: Web 服务使用含 +、/、= 的自定义 token；首次以 URL 参数 token 访问后，后续请求携带服务端下发的 Cookie。
    impact: 首次请求返回 200，之后的 Cookie 请求返回 401；Bearer 鉴权不受影响。
    cause: 写入 Cookie 时对 token 调用 encodeURIComponent，读取 Cookie 后直接与原 token 比较，没有解码。
    fix: Cookie token 在比较前只解码一次；畸形编码返回未授权，URL 参数与 Bearer 路径保持。
    evidence: 真实回环 HTTP 回归在修复前对含 +、/、=、% 和 Unicode 的 token 返回 401；修复后这些 Cookie 请求均返回 200，错误、畸形和双重编码的 Cookie 返回 401，原 URL 与 Bearer 鉴权回归保留。
    files:
      - packages/server/src/http.ts
    regression:
      - packages/server/test/serverInfoHttp.test.ts
    retire: 上游统一 Cookie 写入与读取的编码，含 +、/、= 的 token 经 Cookie 请求返回 200。
    refs:
      - docs/spec/maintenance-fixes-3.16.2.md
      - https://github.com/BlueSkyXN/OpenZWork/commit/872ad960de7ec172591f7e1952f7849229f94521

  - id: OW-P003
    title: PRV-08 测试夹具清理与 Registry 后台刷新争用文件锁
    kind: test
    status: fixed
    upstream:
      since: 3.16.1
      checked: 3.16.2
    trigger: providerProvisioningRealStores 的 PRV-08 用例在提交后注入异常、回滚也失败，随后立即清理临时目录。
    impact: 后台 Registry 刷新仍持有 builtin.json.lock，Windows 删除临时目录时报 EPERM，用例偶发失败。
    cause: 夹具的同步 dispose() 只取消订阅，没有等待已排入的刷新完成就删除临时目录。
    fix: 夹具清理先 await registryService.refresh("fixture-dispose") 排空刷新队列，再释放 Runtime 与默认模型 Repository；重复清理复用同一个 Promise。
    evidence: 回归用真实 withFileLock 持有 Built-in 锁，并用 Promise 控制后台读取；旧清理实现下失败，修复后在 macOS、Linux、Windows 核心 CI 通过。
    files:
      - packages/services/test/providerProvisioningRealStores.test.ts
    regression:
      - packages/services/test/providerProvisioningRealStores.test.ts
    retire: 上游夹具在删除临时目录前等待 Registry 刷新完成，本条回归在上游代码上通过。
    refs:
      - docs/spec/provider-provisioning-test-lifecycle.md
      - https://github.com/BlueSkyXN/OpenZWork/pull/30

  - id: OW-P004
    title: Windows 显式文件清单未选中 Vitest 相关测试
    kind: build
    status: fixed
    upstream:
      since: 3.16.1
      checked: 3.16.2
    trigger: 在 Windows 使用 affected 的 --files 或 lint-staged manifest 入口。
    impact: 文件路径未匹配官方依赖图，目标测试未执行；公共 setup 的全量 trigger 也未匹配。
    cause: node:path.resolve 生成原生路径，直接赋给 Vitest config.related；反斜杠和临时目录别名与 Vitest 依赖图的实际路径不同。
    fix: 存在的文件先解析真实路径，再统一原生路径分隔符为正斜杠；保留官方选择、缺失路径处理及 Git 基线规则。
    evidence: Windows CI 的 manifest 回归成功退出却未生成执行标记，根公共 setup 未报告全量跳过；相同测试在 macOS 和 Linux 通过。新增相对及绝对路径执行回归，并在三平台复核。
    files:
      - scripts/affected-unit-tests/scope.mjs
    regression:
      - scripts/test/affected-unit-test-cli.test.mjs
    retire: 上游相关文件入口统一路径后，Windows 的显式路径、manifest 和公共 setup 回归通过。
    refs:
      - docs/spec/maintenance-fixes-3.16.2.md
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/39958918968/job/120431657202
      - https://github.com/BlueSkyXN/OpenZWork/pull/31

  - id: OW-P005
    title: MCP 写入失败仍更新界面状态
    kind: product
    status: fixed
    priority: P2
    upstream:
      since: 3.15.1
      checked: 3.16.2
    trigger: MCP 目录服务缺失或新增、修改、启停、删除请求失败。
    impact: 新增和修改显示未保存的配置，开关错误改变，删除提前移除条目；调用方无法一致处理失败。
    cause: store 吞掉持久化异常后更新投影，删除及预载入口没有等待写入结果。
    fix: 所有 mutation 等待统一持久化入口，失败 reject 且保留原投影；设置页捕获错误，当前目标成功才执行完成动作。
    evidence: 修复前受控写入回归失败，修复后新增、修改、启停、删除、缺服务及预载失败回归通过；本机平台返回失败也不更新投影。
    files:
      - packages/ui/src/store/mcpStore.ts
      - packages/ui/src/settings/McpSettingsSection.tsx
      - packages/desktop/test/e2e/settings/manual-review/pending/mcp-mutation-errors.test.ts
    regression:
      - packages/ui/test/mcpStoreMutations.test.ts
    retire: 上游所有 MCP 写入入口都向调用方返回失败，失败时原界面及持久化标记保持。
    refs:
      - docs/spec/maintenance-fixes-3.16.2.md
      - https://github.com/BlueSkyXN/OpenZWork/pull/31

  - id: OW-P006
    title: MCP 迟到的保存结果污染新 Source 配置投影
    kind: product
    status: fixed
    priority: P1
    upstream:
      since: 3.15.1
      checked: 3.16.2
    trigger: Source A 保存挂起期间切换 B、切走再切回 A，或更换同 Source 的目录服务。
    impact: 原目标的配置可能写入新目标的共享 store，并进入新目标的 Agent 状态刷新请求。
    cause: 异步写入完成后直接修改当前投影，没有核对操作开始时的目标和服务代次。
    fix: 捕获目标服务与代次，切换或重连推进代次；读取与写回丢弃过期结果，重置旧目标开关投影；界面完成动作核对目标令牌。
    evidence: A→B、A→B→A、同 Source 重连回归覆盖四种 mutation；状态刷新请求不含合成 A 标记，旧代理读取与批量预载不会污染新目标。
    files:
      - packages/ui/src/store/mcpStore.ts
      - packages/ui/src/settings/McpSettingsSection.tsx
    regression:
      - packages/ui/test/mcpStoreMutations.test.ts
    retire: 上游对 MCP 写回及界面完成动作检查目标代次，切换和重连回归不再污染配置投影。
    refs:
      - docs/spec/maintenance-fixes-3.16.2.md
      - https://github.com/BlueSkyXN/OpenZWork/pull/31
