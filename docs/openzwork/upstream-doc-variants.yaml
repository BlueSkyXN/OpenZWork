# 只有以下情况才保留 OpenZWork 版本，role 写明理由：
#   tool       代码读取该文档（usedBy 列出读取方）
#   rule       OpenZWork 的规则或 spec 以该文档为准（usedBy 列出引用方）
#   maintained OpenZWork 改写并持续维护的版本（描述 OpenZWork 当前行为）
#   pending    只有少量 OpenZWork 内容，保留还是删除待用户确认
# 其余上游文档只保留原文；OpenZWork 的差异写在 docs/openzwork/README.md 的「与上游的差异」。
