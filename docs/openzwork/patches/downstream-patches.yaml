      - packages/desktop/test/e2e/helpers/web-remote-visibility-browser.ts
    regression:
      - scripts/test/desktop-e2e-case-config.test.mjs
    retire: 上游导航与可见性记录共用一次成功观察，真实前后台恢复场景通过。

