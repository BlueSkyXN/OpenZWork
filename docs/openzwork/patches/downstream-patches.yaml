  - id: OW-P034
    title: 浏览器导航回归在地址提交或目标页面挂载前读取 guest
    kind: test
    status: fixed
    upstream:
      since: 3.18.2
      checked: 3.18.2
    trigger: 在桌面浏览器打开本地 HTML，目标 guest 仍在挂载时，测试开始等待页面标题。
    impact: 读取上一文档的脚本可能挂起，页面内容回归提前结束。
    cause: 用例用 guest 内的脚本判断导航是否就绪，首个脚本可能发往即将被替换的文档。设计工具用例向全局焦点发送回车，提交前没有核对地址栏的值。
    evidence: CI run 44363189458 中，WebDriver 读取 document.title 的请求先于 Main 的 attachGuest，三十秒后超时。同次运行的设计工具用例从站点设置返回后，第二次导航未观察到目标页。上游 v3.18.2 使用相同的提交和等待方式。
    fix: 聚焦地址栏、全选并输入目标，核对字段值后将回车发给同一字段。先从当前标签观察到目标标题，再进入 guest 核对文档标题与实际内容。
    files:
      - packages/desktop/test/e2e/browser/files/browser-local-html-preview.test.ts
      - packages/desktop/test/e2e/helpers/browser-side-pane.ts
      - packages/desktop/test/e2e/helpers/browser-design-mode.ts
    regression:
      - scripts/test/desktop-e2e-case-config.test.mjs
    retire: 上游等待目标页面挂载后读取实际文档，本地预览导航回归在云端通过。

  - id: OW-P035
    title: Web 开发服务器在第一次远控发送期间优化 diff worker 并刷新页面
    kind: build
    status: fixed
    upstream:
      since: 3.18.2
      checked: 3.18.2
    trigger: 从冷的 Vite 缓存启动 Web，手机配对并首次渲染任务视图。
    impact: 页面在提交或接收首段回复期间刷新，测试在注入断线场景前就已失去原草稿。
    cause: 动态 worker 不在 Web 的启动预构建清单中。Vite 在首次使用时重算依赖，随后要求页面重新加载。
    evidence: CI run 44363189458 和 44372268942 均记录首次发现 @pierre/diffs/worker/worker.js 后整页刷新。第二次的手机项目还未创建任务。独立远控传输用例已显式预构建同一入口。
    fix: Web 开发配置在启动时预构建真实的 diff worker 入口。
    files:
      - packages/web/vite.config.ts
    regression:
      - scripts/test/desktop-e2e-case-config.test.mjs
    retire: 上游开发配置避免在首次远控任务中为该动态入口触发整页刷新，冷缓存手机恢复用例通过。

  - id: OW-P038
    title: 飞书 SDK 提前关闭连接可能让 Host 退出，入站帧异常未记录
    kind: product
    status: fixed
    priority: P2
    upstream:
      since: 3.14.3
      checked: 3.18.2
    trigger: 飞书机器人启动超时或取消时关闭仍在握手的 WebSocket，或入站帧在解码或分派时抛错。
    impact: 关闭过程中的 socket error 可使 Host 退出；入站帧处理异常没有日志。
    cause: 3.18.2 的 services SDK 1.64.0 与 desktop SDK 1.61.1 均缺少关闭时的 error 监听和入站帧捕获。
    evidence: SDK 提交 37d241ee、af41737d；3.18.2 原版本声明回归因两处不一致而失败。
    fix: 两处 SDK 固定为 1.74.0，由发布包提供两项修复，保留现有连接探测方式。
    files:
      - packages/desktop/scripts/bundle.mjs
    regression:
      - packages/services/test/feishuSdkVersion.test.ts
    retire: 上游两处声明采用相同且不低于 1.74.0 的稳定版本，包内保留修复。
    refs:
      - docs/openzwork/patches/feishu-sdk-long-connection.md

  - id: OW-P039
    title: Host 写日志遇到断开的输出管道后退出
    kind: product
    status: fixed
    priority: P3
    upstream:
      since: 3.14.3
      checked: 3.18.2
    trigger: Host 继承的 stdout 或 stderr 为管道，读端先退出后 Host 继续写日志。
    impact: 未捕获的 EPIPE 使 Host 退出，依赖 Host 的窗口操作失去后端。
    cause: 3.18.2 仅 Main 处理自身输出流的错误，Host 没有对应监听器。
    evidence: 核心回归在同一轮分别关闭子进程的 stdout 与 stderr 读端，核对无护栏的未捕获 EPIPE 和有护栏时的存活结果。
    fix: Host 在首次日志前给 stdout 和 stderr 安装 error 监听，只忽略 EPIPE，其他错误原样抛出。
    files:
      - packages/desktop/src/host/hostBrokenPipeGuard.ts
      - packages/desktop/src/host/index.ts
    regression:
      - packages/desktop/test/hostBrokenPipeGuard.test.ts
    retire: 上游在 Host 侧提供等效护栏。
    refs:
      - docs/openzwork/patches/host-broken-pipe-guard.md

  - id: OW-P040
    title: 空 Bash 命令进入审批并可生成工具级授权
    kind: product
    status: fixed
    upstream:
      since: 3.17.2
      checked: 3.18.2
    trigger: 在 Build 模式下调用 Bash，command 为空字符串或只有空白。
    impact: 无操作也弹审批；选择项目级始终允许可保存没有命令范围的 Bash 规则。
    cause: handler 会返回空输出，但普通审批先发生；空命令没有规则建议，协议默认选项退回到工具级规则。
    evidence: 在 3.18.2 主线复现，空字符串和纯空白各调用 broker 一次；非空命令与权限判定的对照用例通过。
    fix: Bash 的 prepareApproval 只短路与 handler 同判定的合法空命令；普通非空询问和权限服务的拒绝路径不变。
    files:
      - apps/zcode-cli/packages/core/src/tool/handlers/bash.ts
    regression:
      - apps/zcode-cli/packages/core/tests/bash-empty-command-approval.test.ts
    refs:
      - docs/specs/bash-empty-command-approval-openzwork.md
    retire: 上游空命令不会产生审批、保存规则或调用执行端口，同时非空命令审批保持有效。
