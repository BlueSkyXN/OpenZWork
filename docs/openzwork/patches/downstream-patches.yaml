  - id: OW-P010
    title: Bash 集成回归在真实进程完成或写入首段输出前超时
    kind: test
    status: fixed
    upstream:
      since: 3.16.2
      checked: 3.18.2
    trigger: Windows Git Bash 编码回归的准备与执行合计超过默认 5 秒，或后台输出回归中真实 Node 子进程的首段写入晚于 1 秒。
    impact: 命令执行或输出文件写入尚在进行，Vitest 已中止编码测试，或将空文件判为缺少首段输出。
    cause: 编码用例的外层 5 秒短于命令的 10 秒期限；部分后台用例继承 vi.waitFor 的 1 秒默认值。
    fix: 四种编码执行方式使用 20 秒外层预算。后台读取与取消用例沿用同组 5 秒首段就绪预算，持续检查实际文件内容；命令期限、退出与完整输出断言独立执行。
    evidence: 主分支 Windows CI 在 Git Bash foreground 用例报告 5000ms 超时；上游 3.16.2 的测试源码同时保留 10000ms 执行请求。外层预算修复后继续用真实 shell 回归，超时转后台、取消和失败退出仍会被断言拒绝。 v3.17.2 复核：相关上游文件较 v3.17.1 未变，继续保留现有修复与回归。 v3.18.0 复核：bash-direct-execution.test.ts 较 v3.17.2 未变；编码用例回归通过，继续保留现有修复与回归。CI run 44350954775 在 Linux 后台首段写入前失败，在定向测试中延后真实 writer 启动 1.3 秒可复现。
    files:
      - apps/zcode-cli/packages/adapters/tests/bash-direct-execution.test.ts
    regression:
      - apps/zcode-cli/packages/adapters/tests/bash-direct-execution.test.ts
    retire: 上游明确区分真实 shell 集成测试预算与命令执行期限，并保留成功状态、退出码、完整输出和编码解析次数断言。
    refs:
      - docs/testing/pre-push-hook.md
      - https://github.com/BlueSkyXN/OpenZWork/actions/runs/40314941762/job/121545062554

  - id: OW-P011
    title: 录屏编码超时单测将真实帧准备时间计入竞争期限
    kind: test
    status: fixed
    upstream:
      since: 3.15.1
      checked: 3.18.2
    trigger: 自定义编码器永不结束的单测中，抓帧、写文件和整理帧序列消耗 stop 总预算，编码器的 30ms 期限尚未先到。
    impact: Windows Extended 期望编码超时，却收到 stop 在 100ms 到期的错误；正常的总预算保护被误报为编码器测试失败。
    cause: 上游夹具同时使用真实文件 IO、30ms 编码期限与 100ms stop 总期限，未在编码器实际进入后控制时钟。
    fix: 使用受控时钟并等待编码器进入信号，断言 29ms 尚未结束、30ms 报编码超时且取消信号；保留原期限及独立的 stop 总预算和真实子进程回归，加入核心套件。
