# pnpm 11 起 .npmrc 只保留 auth/registry，其余设置必须写在这里；
# nodeLinker=hoisted 是既有布局（Electron 打包与桌面运行时依赖真实目录树），
# 从 .npmrc 迁移而来，行为不变。
nodeLinker: hoisted
# pnpm 11 默认在 run 前校验依赖并触发安装；嵌套 workspace（apps/zcode-cli 是独立
# workspace 成员）解析不到外层 packages/*（如 @zcode/model-option-map），校验必失败。
# 与 scripts/build-desktop-agent-cli.mjs 的 PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=0 等效，
# 但持久化在配置里，turbo 等任何子进程链路都生效。
verifyDepsBeforeRun: false
packages:
  - apps/dev-docs
  - packages/*
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
# pnpm 11 不再读 package.json 的 "pnpm" 字段（会静默忽略），overrides 与
# patchedDependencies 迁到这里。内容与迁移前一一对应，无增减。
overrides:
  react: 19.2.7
  react-dom: 19.2.7
patchedDependencies:
  vitest@4.1.7: patches/vitest@4.1.7.patch
  wdio-electron-service@9.2.1: patches/wdio-electron-service@9.2.1.patch
  "@ai-sdk/openai-compatible@2.0.60": patches/@ai-sdk__openai-compatible@2.0.60.patch
  "@ai-sdk/anthropic@3.0.81": patches/@ai-sdk__anthropic@3.0.81.patch
